name: Windows desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the packaged desktop app
        run: npm run test:desktop
        env:
          AXTIFY_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked\Axtify.exe
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Axtify-Windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            test-results/desktop-app.png
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --title "Axtify $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-1.1.0.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
